<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <!-- Whiteboard Background -->
    <rect width="100%" height="100%" fill="#f8fafc" rx="8"/>
    
    <!-- Dirt / Infield Arch -->
    <path d="M 50 250 Q 200 50 350 250" fill="none" stroke="#e2e8f0" stroke-width="40"/>
    <path d="M 50 250 Q 200 50 350 250" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Bases -->
    <rect x="190" y="240" width="20" height="20" fill="white" stroke="#94a3b8" stroke-width="2" transform="rotate(45 200 250)"/> <!-- Home -->
    <rect x="300" y="150" width="20" height="20" fill="white" stroke="#94a3b8" stroke-width="2" transform="rotate(45 310 160)"/> <!-- 1st Base -->
    <rect x="80" y="150" width="20" height="20" fill="white" stroke="#94a3b8" stroke-width="2" transform="rotate(45 90 160)"/> <!-- 3rd Base -->
    
    <!-- Coach 1 (Hitting to SS) -->
    <circle cx="180" cy="230" r="12" fill="#ef4444"/>
    <text x="180" y="235" font-family="sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">C1</text>
    
    <!-- Coach 2 (Hitting to 2B) -->
    <circle cx="220" cy="230" r="12" fill="#ef4444"/>
    <text x="220" y="235" font-family="sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">C2</text>
    
    <!-- Player Line 1 (SS) -->
    <circle cx="120" cy="110" r="10" fill="#3b82f6"/>
    <circle cx="110" cy="90" r="10" fill="#93c5fd"/>
    <circle cx="100" cy="70" r="10" fill="#93c5fd"/>
    <text x="120" y="114" font-family="sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">SS</text>
    
    <!-- Player Line 2 (2B) -->
    <circle cx="280" cy="110" r="10" fill="#3b82f6"/>
    <circle cx="290" cy="90" r="10" fill="#93c5fd"/>
    <circle cx="300" cy="70" r="10" fill="#93c5fd"/>
    <text x="280" y="114" font-family="sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">2B</text>
    
    <!-- Target Nets -->
    <rect x="60" y="140" width="4" height="20" fill="#ef4444"/> <!-- Net at 3rd -->
    <text x="50" y="155" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">Net</text>
    
    <rect x="336" y="140" width="4" height="20" fill="#ef4444"/> <!-- Net at 1st -->
    <text x="350" y="155" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="start">Net</text>

    <!-- Grounder Paths (Dashed Lines) -->
    <path d="M 175 220 L 125 120" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 225 220 L 275 120" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Throw Paths (Dotted Lines) -->
    <path d="M 115 115 L 70 145" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="2,4"/>
    <path d="M 285 115 L 330 145" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="2,4"/>
</svg>
